[project]
name = "xdraft"
version = "0.1.0"
description = "Turn your AI usage, model takes and AI news into bilingual X drafts you approve before posting."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "sqlmodel>=0.0.22",
    "pyyaml>=6.0",
    "feedparser>=6.0",
    "httpx>=0.27",
    "typer>=0.12",
    "fastapi>=0.165.0",
    "uvicorn>=0.54.0",
    "jinja2>=3.1.6",
    "python-multipart>=0.0.34",
    "apscheduler>=3.11.3",
    "openai>=3.57.0",
    "tzdata>=2026.6",
    "trafilatura>=2.3.1",
]

[project.scripts]
xdraft = "xdraft.cli:app"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
