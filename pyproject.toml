[project]
name = "xdraft"
version = "0.1.0"
description = "Turn your AI usage, model takes and AI news into bilingual X drafts you approve before posting."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "sqlmodel>=0.0.22",
    "pyyaml>=6.0",
    "feedparser>=6.0",
    "httpx>=0.27",
    "typer>=0.12",
]

[project.optional-dependencies]
fulltext = ["trafilatura>=1.12"]

[project.scripts]
xdraft = "xdraft.cli:app"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
